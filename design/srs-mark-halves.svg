<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 24 24">
  <!-- The SRS mark (halves), optimised from the owner's Inkscape refinement. Six shapes, painted in order.
       Source of truth is src/components/diagram/Halves.astro; this is a reference export, not used by the site.
       Proportions of the disc radius r = 10.75: S line 0.093r, rim 0.116r, seeds 0.14r at half-radius. -->
  <circle cx="12" cy="12" r="10.75" fill="#f4f2ee"/>
  <path d="M12 1.25A10.75 10.75 0 0 1 12 22.75A5.375 5.375 0 0 0 12 12A5.375 5.375 0 0 1 12 1.25Z" fill="#1a1a1a"/>
  <!-- The S line: change this stroke for a coloured S (vermilion #cc3300, blue #0038a0, khaki #857a4c) -->
  <path d="M12 1.25A5.375 5.375 0 0 0 12 12A5.375 5.375 0 0 1 12 22.75" fill="none" stroke="#c8c4bc" stroke-width="1"/>
  <circle cx="12" cy="6.625" r="1.505" fill="#f4f2ee"/>
  <circle cx="12" cy="17.375" r="1.505" fill="#1a1a1a"/>
  <circle cx="12" cy="12" r="10.75" fill="none" stroke="#1a1a1a" stroke-width="1.25"/>
</svg>
